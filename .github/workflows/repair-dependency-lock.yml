name: Repair dependency lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/platform-closure-hardening-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for security overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update lockfile for patched sharp"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
