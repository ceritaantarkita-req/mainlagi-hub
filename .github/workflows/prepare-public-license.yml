name: Prepare public license

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-license:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/public-open-source-readiness-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch canonical AGPL-3.0-only license text
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/AGPL-3.0-only.txt \
            -o LICENSE
          grep -q '^GNU AFFERO GENERAL PUBLIC LICENSE$' LICENSE
          grep -q '^Version 3, 19 November 2007$' LICENSE
          grep -q 'END OF TERMS AND CONDITIONS' LICENSE
      - name: Synchronize package lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated public-release files
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- LICENSE package-lock.json; then
            echo "LICENSE and package-lock.json are already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE package-lock.json
          git commit -m "Add canonical AGPL license and sync lock metadata"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
