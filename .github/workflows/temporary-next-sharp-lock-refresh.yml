name: Temporary Next and sharp lock refresh
on:
  push:
    branches:
      - fix/npm-security-next-sharp-20261008
    paths:
      - package.json
      - .github/workflows/temporary-next-sharp-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.repository == 'ceritaantarkita-req/mainlagi-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Resolve exact patched lockfile without install scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json').packages;const v=x=>p['node_modules/'+x].version;if(v('next')!=='16.3.8'||v('sharp')!=='0.35.5')process.exit(1);for(const [k,t] of Object.entries(p)) if(k.endsWith('/sharp') && t.version !== '0.35.5') { console.error(k,t.version); process.exit(1) }"
      - name: Save generated lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): regenerate patched Next and sharp lock"
            git push origin HEAD:refs/heads/fix/npm-security-next-sharp-20261008
          fi
