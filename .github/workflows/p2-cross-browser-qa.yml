name: P2 cross-browser responsive QA (observational)

on:
  pull_request:
    paths:
      - scripts/run-p2-cross-browser-qa.mjs
      - .github/workflows/p2-cross-browser-qa.yml
      - docs/P2_CROSS_DEVICE_QA_2026-11-04.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-browser-matrix:
    name: P2 browser QA (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      MAINLAGI_P2_QA_ENGINE: ${{ matrix.browser }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4010
      NEXT_PUBLIC_DATA_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install selected Playwright browser and system libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build local production app
        run: npm run build
      - name: Run P2 responsive/landscape matrix (no production writes)
        run: node scripts/run-p2-cross-browser-qa.mjs
      - name: Upload P2 screenshots and detailed result manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-cross-browser-${{ matrix.browser }}
          path: .qa/p2-cross-browser/${{ matrix.browser }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
