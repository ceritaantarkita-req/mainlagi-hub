name: P0 dependency patch staging (temporary, review-only)
on:
  push:
    branches:
      - agent/p0-production-deps-20261026
    paths:
      - .github/workflows/p0-dependency-patch-stage.yml

permissions:
  contents: write

jobs:
  stage-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve minimal security updates into the lockfile
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='package.json',p=JSON.parse(fs.readFileSync(file,'utf8'));
          p.dependencies.next='16.4.3';
          p.dependencies['sanitize-html']='2.18.1';
          p.dependencies['@opennextjs/cloudflare']='^1.20.12';
          p.overrides['undici']='7.30.1';
          p.overrides['body-parser']='2.4.0';
          fs.writeFileSync(file,JSON.stringify(p,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Enforce unchanged production dependency security threshold
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check Next build and Cloudflare adapter
        run: npm run build && npm run build:cloudflare
      - name: Upload exact resolved manifests for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-resolved-package-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit ONLY when security and both builds succeeded
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'security: patch Next, sanitizer and transitive request packages'
          git push origin HEAD:agent/p0-production-deps-20261026
