name: Import Core Thumbnail Wave 01

on:
  push:
    branches:
      - feat/mainlagi-core-thumbnail-system-20260926
    paths:
      - .github/workflows/import-core-thumbnails.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mainlagi-core-thumbnail-system-20260926
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download and optimize canonical 4:3 thumbnails
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image
          import io

          assets = [
              ("1kx1Th8O8z7kq7eutSIngBFauiPCCi76-", "home-hero-mainlagi.webp"),
              ("10bxPivKQyoZFLJnR1P3YaI2ln9Bq27EU", "subject-bahasa-indonesia.webp"),
              ("17jpm4DJdyA_R8jlXHtrUQyZOI_Z6X5ox", "subject-bahasa-inggris.webp"),
              ("1HeFEA-AM9Km88QI7AscIlR3ymoQkA9_S", "subject-huruf-menulis.webp"),
              ("1xcDvhBoVAFXbbhtVEmP6wc4p2MOl7Ank", "subject-iqro.webp"),
              ("1ZrBK4r5i0NxDY-xsDEYh13BP-F6Nbxjw", "subject-matematika.webp"),
              ("1sRjzWI43KKjhhlhcZbouWRzXoew_aOg5", "subject-logika.webp"),
              ("1Ws1Td_UwDYAHfUZJU9iv1SWBlcIDij22", "subject-sains.webp"),
              ("1w4DbEDa0nsSOXyVLOyotZwNxYuw83OhX", "subject-mewarnai.webp"),
              ("16xbKsg-wEtYx3jrS_RMu19KkVJfsPqpQ", "subject-menggambar.webp"),
              ("17345c5AasVdth5YzqcnUQ6yk_nu7KZT2", "game-pilih-jawaban.webp"),
              ("1FXyEVyNdTDLZNxDvnPUoFpGBdW9F11ag", "game-math-battle.webp"),
              ("1Kw7TpNeP69jmwG9r2IUpQYh400zsXDJH", "game-number-trace.webp"),
              ("1Co3VGnNym5KztDJAuVL8zp40fez8eubP", "game-shape-quest.webp"),
              ("1Py-5CCiok_nMUsDRlegYJeoP_0P1Fh0e", "game-pattern-race.webp"),
              ("1ZehqnGailgyt0msMDQLOr8ZidUgSfDQ9", "game-math-warung.webp"),
              ("1fOUjB5RsE1vWaCCipwFLhKvcZRc7N0Ud", "game-iqro-motion.webp"),
              ("1XrZI-qoOIfjiurD577zEMBX2UbjxVvLm", "game-aiboard.webp"),
              ("1Z5Wqu_W54qTeWY_OMO6di2kYBbma8-wz", "game-beat-motion.webp"),
              ("1YTTkU-CJLpnw3kTl1Tg2GyUsrzzLxTfH", "game-run-to-target.webp"),
              ("1xj4L_j8WSIK9Z_CSPx-T5LPOzgEUV8Qp", "main-gerak-header.webp"),
              ("1HGJ3gEsSpE0illgWKd12FHKkrPRkP4QM", "world-header-mainlagi.webp"),
              ("1Pv1KkFxiwWCieRUHl2OwiPQJA44Lt3CZ", "world-uang-investasi.webp"),
              ("18EbHVbXo7c-QKxXHmWUOB88e50uSMqNR", "world-arsitek-interior.webp"),
              ("1FQFbI1CnZoousvEpn1k5YmQo2Wib3lTe", "world-youtuber-content-creator.webp"),
              ("1UNLz0UNE8J0ncGEMOEMoJvRmPHcfqd6y", "world-pembalap-mobil.webp"),
              ("1lCI_b6S5c0ekgoPQSsur8YPdKob9zqh1", "world-robot-engineer.webp"),
              ("1pMf5FfcA9TrjNADesa_e45HLlktrYEQ4", "world-ai-software-engineer.webp"),
              ("1I9SBGl7f57YQnmUlXeqd1iitEcS_58s1", "world-dokter.webp"),
              ("1u6i0VgkMD90DMLvhu2qkz8At1ORzhb0I", "world-ilmuwan-penjelajah-alam.webp"),
              ("14QlElpWIz7bYnyZVTRwurMTA5ap-Q-Sq", "world-chef-pemilik-restoran.webp"),
          ]

          out = Path("public/artwork/core-thumbnails")
          out.mkdir(parents=True, exist_ok=True)

          for file_id, filename in assets:
              url = f"https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t"
              req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(req, timeout=60) as response:
                  payload = response.read()

              with Image.open(io.BytesIO(payload)) as image:
                  if image.size != (1448, 1086):
                      raise RuntimeError(f"{filename}: expected 1448x1086, got {image.size}")
                  image = image.convert("RGB").resize((1200, 900), Image.Resampling.LANCZOS)
                  image.save(out / filename, "WEBP", quality=86, method=6)

              print(f"{filename}: {(out / filename).stat().st_size} bytes")

          generated = sorted(out.glob("*.webp"))
          if len(generated) != 31:
              raise RuntimeError(f"expected 31 generated assets, got {len(generated)}")
          PY

      - name: Commit optimized assets to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/artwork/core-thumbnails
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "assets: import core thumbnail Wave 01"
          git push origin HEAD:feat/mainlagi-core-thumbnail-system-20260926
