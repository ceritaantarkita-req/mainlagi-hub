name: Mainlagi TV V3 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-history-scan:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.11'
      - name: Install pinned Gitleaks
        shell: bash
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan full Git history
        shell: bash
        run: |
          set -Eeuo pipefail
          "$(go env GOPATH)/bin/gitleaks" git \
            --redact \
            --no-banner \
            --verbose \
            --log-opts="--all" \
            .

  quality:
    name: Quality gate (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate structure, assets, and source
        run: npm run validate:structure && npm run validate:assets && npm run audit:source
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm run test:engine
      - name: Simulations
        run: npm run simulate

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare/OpenNext production artifact
        run: npm run build:cloudflare

  windows-quality:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm run test:engine

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
