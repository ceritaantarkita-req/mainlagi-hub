name: Mainlagi TV V3 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-history-scan:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.11'
      - name: Install pinned Gitleaks
        shell: bash
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan full Git history
        shell: bash
        run: |
          set -Eeuo pipefail
          "$(go env GOPATH)/bin/gitleaks" git \
            --redact \
            --no-banner \
            --verbose \
            --log-opts="--all" \
            .

  quality:
    name: Quality gate (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate structure, assets, and source
        run: npm run validate:structure && npm run validate:assets && npm run audit:source
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm run test:engine
      - name: Simulations
        run: npm run simulate

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare/OpenNext production artifact
        run: npm run build:cloudflare

  mobile-route-qa:
    name: Mobile route QA (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4010
      NEXT_PUBLIC_DATA_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for responsive QA
        run: npx playwright install --with-deps chromium
      - name: Build local production app
        run: npm run build
      - name: Run canonical mobile route matrix
        run: npm run test:ui:mobile-routes
      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-route-qa-screenshots
          path: .mobile-route-qa/
          if-no-files-found: ignore
          retention-days: 14

  windows-quality:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm run test:engine

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  production-smoke:
    name: Production smoke (Cloudflare)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - secret-history-scan
      - quality
      - build
      - mobile-route-qa
      - windows-quality
      - dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for exact Cloudflare release and smoke public endpoints
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://mainlagihub.my.id
          EXPECTED_SUPABASE_PROJECT_REF: estvtgflwkebomsqlolv
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 30); do
            home_code="$(curl -sS -L -o /tmp/mainlagi-home.html -w '%{http_code}' \
              --connect-timeout 10 --max-time 20 "$BASE_URL/" || true)"
            health_body="$(curl -sS --connect-timeout 10 --max-time 20 \
              "$BASE_URL/api/health" || true)"

            if [[ "$home_code" == "200" ]] \
              && grep -Fq '"ok":true' <<<"$health_body" \
              && grep -Fq "\"sha\":\"$EXPECTED_SHA\"" <<<"$health_body" \
              && grep -Fq '"branch":"main"' <<<"$health_body" \
              && grep -Fq '"siteUrl":"https://mainlagihub.my.id"' <<<"$health_body" \
              && grep -Fq '"dataBackend":"supabase"' <<<"$health_body" \
              && grep -Fq "\"supabaseProjectRef\":\"$EXPECTED_SUPABASE_PROJECT_REF\"" <<<"$health_body"; then
              echo "Production is serving expected commit $EXPECTED_SHA with canonical Supabase target."
              echo "$health_body"
              exit 0
            fi

            echo "Attempt $attempt/30: homepage=$home_code; waiting for exact release/configuration target"
            sleep 10
          done

          echo "Production did not serve the expected commit/configuration within the smoke-test window."
          echo "Last health response: $health_body"
          exit 1
