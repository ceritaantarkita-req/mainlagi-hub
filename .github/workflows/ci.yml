name: Mainlagi TV V3 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-history-scan:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Scan full Git history
        shell: bash
        run: bash scripts/run-secret-history-scan.sh

  quality:
    name: Quality gate (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate structure, assets, and source
        run: npm run validate:structure && npm run validate:assets && npm run audit:source
      - name: Batch 16 security boundary regressions
        run: npm run test:batch16:security
      - name: Physical-device QA harness contract
        run: npm run test:qa:device
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm run test:engine
      - name: Audit learning activity quality
        run: npm run qa:activity-quality
      - name: Upload activity-quality audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-quality-audit
          path: .qa/activity-quality/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      - name: Audit gameplay distribution
        run: npm run qa:gameplay-distribution
      - name: Upload gameplay-distribution audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-distribution-audit
          path: .qa/gameplay-distribution/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      - name: Simulations
        run: npm run simulate
      - name: Batch 17 final acceptance contracts
        run: npm run test:batch17:final

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare/OpenNext production artifact
        run: npm run build:cloudflare
      - name: Batch 16 production JS and lazy-load budgets
        run: npm run test:batch16:build

  mobile-route-qa:
    name: Mobile route QA (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4010
      NEXT_PUBLIC_DATA_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for responsive QA
        run: npx playwright install --with-deps chromium
      - name: Build local production app
        run: npm run build
      - name: Audit Batch 16 build budgets
        run: npm run test:batch16:build
      - name: Validate coloring artwork geometry
        run: npm run test:ui:coloring-art
      - name: Run canonical mobile route, accessibility, and lazy-load matrix
        run: npm run test:ui:mobile-routes
      - name: Run permanent visual product baseline
        run: node scripts/run-visual-baseline-browser-tests.mjs
      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-route-qa-screenshots
          path: .mobile-route-qa/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

  windows-quality:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm run test:engine

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Required full-history secret gate
        shell: bash
        run: bash scripts/run-secret-history-scan.sh
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Pin current npm audit client
        run: |
          npm install --global npm@11.19.1 --no-audit --no-fund
          npm --version
      - name: Audit production dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          max_attempts=4
          transient_exhausted=0

          for attempt in $(seq 1 "$max_attempts"); do
            set +e
            audit_output="$(npm audit --omit=dev --audit-level=high 2>&1)"
            audit_status=$?
            set -e

            printf '%s\n' "$audit_output"

            if [[ "$audit_status" -eq 0 ]]; then
              exit 0
            fi

            if grep -Eqi '503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|429 Too Many Requests|performing maintenance|ECONNRESET|ETIMEDOUT|EAI_AGAIN' <<<"$audit_output"; then
              if [[ "$attempt" -lt "$max_attempts" ]]; then
                delay=$((attempt * 15))
                echo "Transient npm audit registry failure on attempt $attempt/$max_attempts; retrying in ${delay}s."
                sleep "$delay"
                continue
              fi

              transient_exhausted=1
              break
            fi

            exit "$audit_status"
          done

          if [[ "$transient_exhausted" -ne 1 ]]; then
            exit 1
          fi

          echo "npm audit advisory service remained unavailable; running pinned production-only OSV fallback."
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.5

          cat > /tmp/osv-production.toml <<'EOF'
          [[PackageOverrides]]
          group = "dev"
          ignore = true
          reason = "Production-only fallback while npm advisory service is unavailable"
          EOF

          "$(go env GOPATH)/bin/osv-scanner" scan source \
            --lockfile=package-lock.json \
            --config=/tmp/osv-production.toml \
            --format=vertical

  production-smoke:
    name: Production smoke (Cloudflare)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - secret-history-scan
      - quality
      - build
      - mobile-route-qa
      - windows-quality
      - dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve docs-only production fallback SHA
        id: release-target
        shell: bash
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          fallback_sha=""
          parent_sha="$(git rev-parse "$CURRENT_SHA^" 2>/dev/null || true)"
          current_non_docs="$(git diff --name-only "$parent_sha" "$CURRENT_SHA" 2>/dev/null | grep -Ev '^docs/' || true)"

          if [[ -n "$parent_sha" && -z "$current_non_docs" ]]; then
            probe="$parent_sha"
            while true; do
              probe_parent="$(git rev-parse "$probe^" 2>/dev/null || true)"
              if [[ -z "$probe_parent" ]]; then
                break
              fi

              probe_non_docs="$(git diff --name-only "$probe_parent" "$probe" | grep -Ev '^docs/' || true)"
              if [[ -n "$probe_non_docs" ]]; then
                fallback_sha="$probe"
                break
              fi

              probe="$probe_parent"
            done
          fi

          echo "fallback_sha=$fallback_sha" >> "$GITHUB_OUTPUT"
          if [[ -n "$fallback_sha" ]]; then
            echo "Docs-only main commit detected; production may legitimately remain on nearest non-docs release $fallback_sha."
          else
            echo "Runtime/config-affecting main commit detected; exact current SHA is required."
          fi

      - name: Wait for exact Cloudflare release and smoke public endpoints
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DOCS_ONLY_FALLBACK_SHA: ${{ steps.release-target.outputs.fallback_sha }}
          BASE_URL: https://mainlagihub.my.id
          EXPECTED_SUPABASE_PROJECT_REF: estvtgflwkebomsqlolv
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 30); do
            home_code="$(curl -sS -L -o /tmp/mainlagi-home.html -w '%{http_code}' \
              --connect-timeout 10 --max-time 20 "$BASE_URL/" || true)"
            health_body="$(curl -sS --connect-timeout 10 --max-time 20 \
              "$BASE_URL/api/health" || true)"

            sha_matches=0
            if grep -Fq "\"sha\":\"$EXPECTED_SHA\"" <<<"$health_body"; then
              sha_matches=1
            elif [[ -n "$DOCS_ONLY_FALLBACK_SHA" ]] \
              && grep -Fq "\"sha\":\"$DOCS_ONLY_FALLBACK_SHA\"" <<<"$health_body"; then
              sha_matches=1
            fi

            if [[ "$home_code" == "200" ]] \
              && [[ "$sha_matches" -eq 1 ]] \
              && grep -Fq '"ok":true' <<<"$health_body" \
              && grep -Fq '"branch":"main"' <<<"$health_body" \
              && grep -Fq '"siteUrl":"https://mainlagihub.my.id"' <<<"$health_body" \
              && grep -Fq '"dataBackend":"supabase"' <<<"$health_body" \
              && grep -Fq "\"supabaseProjectRef\":\"$EXPECTED_SUPABASE_PROJECT_REF\"" <<<"$health_body"; then
              if grep -Fq "\"sha\":\"$EXPECTED_SHA\"" <<<"$health_body"; then
                echo "Production is serving exact current commit $EXPECTED_SHA with canonical Supabase target."
              else
                echo "Docs-only commit did not create a new release; production remains on verified non-docs ancestor $DOCS_ONLY_FALLBACK_SHA."
              fi
              echo "$health_body"
              exit 0
            fi

            echo "Attempt $attempt/30: homepage=$home_code; waiting for allowed exact release/configuration target"
            sleep 10
          done

          echo "Production did not serve the expected current SHA or allowed docs-only fallback within the smoke-test window."
          echo "Last health response: $health_body"
          exit 1
