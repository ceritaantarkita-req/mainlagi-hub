name: Mainlagi TV V3 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-history-scan:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Scan full Git history
        shell: bash
        run: bash scripts/run-secret-history-scan.sh

  quality:
    name: Quality gate (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate structure, assets, and source
        run: npm run validate:structure && npm run validate:assets && npm run audit:source
      - name: Child visual hierarchy foundation contracts
        run: npm run test:ui:child-visual-foundation
      - name: Batch 16 security boundary regressions
        run: npm run test:batch16:security
      - name: Physical-device QA harness contract
        run: npm run test:qa:device
      - name: Shop owner-input intake contract
        run: npm run test:shop:owner-input
      - name: Shop transaction and provider contracts
        run: npm run test:shop
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm run test:engine
      - name: Audit learning activity quality
        run: npm run qa:activity-quality
      - name: Upload activity-quality audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-quality-audit
          path: .qa/activity-quality/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      # Observational only: counts and paths are review candidates, NOT UX pass/fail.
      - name: Audit child visual source inventory
        run: npm run qa:child-visual-system
      - name: Upload child visual source inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-visual-source-inventory
          path: .qa/child-visual/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Audit gameplay distribution
        run: npm run qa:gameplay-distribution
      - name: Upload gameplay-distribution audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-distribution-audit
          path: .qa/gameplay-distribution/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      - name: Simulations
        run: npm run simulate
      - name: Batch 17 final acceptance contracts
        run: npm run test:batch17:final

  shop-postgres-staging:
    name: Shop PostgreSQL staging gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mainlagi_shop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mainlagi_shop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mainlagi_shop_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run full Shop PostgreSQL staging/security/concurrency gate
        shell: bash
        run: bash scripts/run-shop-postgres-staging-tests.sh

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare/OpenNext production artifact
        run: npm run build:cloudflare
      - name: Batch 16 production JS and lazy-load budgets
        run: npm run test:batch16:build

  mobile-route-qa:
    name: Mobile route QA (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4010
      NEXT_PUBLIC_DATA_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for responsive QA
        run: npx playwright install --with-deps chromium
      - name: Shop responsive visual and accessibility QA
        run: npm run test:shop:browser
      - name: Build local production app
        run: npm run build
      - name: Audit Batch 16 build budgets
        run: npm run test:batch16:build
      - name: Shop production HTTP boundary
        run: npm run test:shop:http
      - name: Validate coloring artwork geometry
        run: npm run test:ui:coloring-art
      - name: Run canonical mobile route, accessibility, and lazy-load matrix
        run: npm run test:ui:mobile-routes
      # Evidence-first VSG-11 Drawing audit. No creative runtime changes.
      - name: Run Drawing touch, undo/reset, and short-landscape QA
        run: npm run test:ui:vsg11-drawing
      - name: Upload VSG-11 Drawing workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg11-drawing-workspace-screenshots
          path: .vsg11-drawing-workspace/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Run permanent visual product baseline
        run: node scripts/run-visual-baseline-browser-tests.mjs
      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-route-qa-screenshots
          path: .mobile-route-qa/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
      # Isolated VSG-02 visual evidence: 5 viewport sizes × 3 states.
      # Preserve before unrelated tests clean the shared mobile QA directory.
      - name: Upload VSG-02 Material Lab screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg02-material-lab-screenshots
          path: .vsg02-material-lab/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      # One-question Investigation Board evidence: five viewport widths x
      # idle/wrong/success, preserved independently of other mobile captures.
      - name: Upload VSG-03 Investigation Board screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg03-investigation-board-screenshots
          path: .vsg03-investigation-board/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # One visible question and preserved cause/condition/result evidence
      # at 320/390/430/768/1280 x idle/try/success.
      - name: Upload VSG-04 Cause Effect screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg04-cause-effect-screenshots
          path: .vsg04-cause-effect/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # VSG-05: separate 320/390/430/768/1280 × idle/intermediate/wrong/success
      # evidence from two-step Rule Pipeline, before unrelated QA cleanup.
      - name: Upload VSG-05 Rule Pipeline screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg05-rule-pipeline-screenshots
          path: .vsg05-rule-pipeline/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # VSG-06: five viewport Set Reasoning idle/help/wrong/success states.
      - name: Upload VSG-06 Set Reasoning screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg06-set-reasoning-screenshots
          path: .vsg06-set-reasoning/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # VSG-07: 5 viewport Transitive Chain original question + two premises.
      - name: Upload VSG-07 Transitive Chain screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg07-transitive-chain-screenshots
          path: .vsg07-transitive-chain/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # VSG-08: 5 viewport Relative Order, original masked-slot and cue.
      - name: Upload VSG-08 Relative Order screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg08-relative-order-screenshots
          path: .vsg08-relative-order/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # VSG-09: five opt-in on-demand Help families at five viewport widths.
      # 25 screenshots accompany computed opaque-background/ink assertions.
      - name: Upload VSG-09 shared Help contrast screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg09-shared-help-contrast-screenshots
          path: .vsg09-shared-help/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # VSG-12: first question, hidden outcome, help, wrong and success
      # at 320/390/430/768/1280px.
      - name: Upload VSG-12 Spatial Transform screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsg12-spatial-transform-screenshots
          path: .vsg12-spatial-transform/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # 30 canonical idle/try/success captures + 10 on-demand Help states,
      # isolated from hundreds of unrelated mobile QA images for visual approval.
      - name: Upload VQA-08 Picture Word visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqa08-picture-word-screenshots
          path: .vqa08-picture-word/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # Preserve Cloze-specific snapshots before later mobile tests reset the shared directory.
      - name: Upload VQA-09 Cloze bilingual screenshot matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqa09-cloze-sentence-screenshots
          path: .vqa09-cloze-sentence/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # Sentence Order visual QA evidence is copied before later tests clean mobile screenshots.
      - name: Upload VQA-10 Sentence Order screenshot matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqa10-sentence-order-screenshots
          path: .vqa10-sentence-order/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # Reading Passage QA snapshots are copied before shared mobile screenshot cleanup.
      - name: Upload VQA-11 Reading Passage screenshot matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqa11-reading-passage-screenshots
          path: .vqa11-reading-passage/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # Syllable Assembly snapshots captured before the shared screenshot cleanup.
      - name: Upload VQA-12 Syllable first-action screenshot matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqa12-syllable-first-action-screenshots
          path: .vqa12-syllable-assembly/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # Phrase Scene proof of true viewport-bound Completion, including Share visibility.
      - name: Upload VQA-13 Phrase Scene completion screenshot matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqa13-phrase-completion-screenshots
          path: .vqa13-phrase-completion/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # VQA-16 separate original Odd One Out mobile screenshots before shared QA cleanup.
      - name: Upload VQA-16 Odd One Out label screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqa16-odd-one-out-label-screenshots
          path: .vqa16-odd-one-out/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # VQA-06 AudioChoice captures live outside the standard screenshots directory,
      # which the later mobile-route runner clears before its own collection.
      - name: Upload VQA-06 audio-first QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqa06-audio-first-screenshots
          path: .vqa06-audio-first/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # Drawing Stage QA is generated by JM-06 before the mobile runner clears
      # its own screenshot folder; use a dedicated evidence artifact.
      - name: Upload Drawing Stage visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawing-stage-qa-screenshots
          path: .drawing-stage-qa/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      # The canonical mobile runner clears .mobile-route-qa; preserve creative
      # Coloring/Drawing evidence separately for human 320/390/768/1280 review.
      - name: Upload VQA-07 creative canvas QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqa07-creative-canvas-screenshots
          path: .vqa07-creative-canvas/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  windows-quality:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm run test:engine

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Required full-history secret gate
        shell: bash
        run: bash scripts/run-secret-history-scan.sh
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Pin current npm audit client
        run: |
          npm install --global npm@11.19.1 --no-audit --no-fund
          npm --version
      - name: Audit production dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          max_attempts=4
          transient_exhausted=0

          for attempt in $(seq 1 "$max_attempts"); do
            set +e
            audit_output="$(npm audit --omit=dev --audit-level=high 2>&1)"
            audit_status=$?
            set -e

            printf '%s\n' "$audit_output"

            if [[ "$audit_status" -eq 0 ]]; then
              exit 0
            fi

            if grep -Eqi '503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|429 Too Many Requests|performing maintenance|ECONNRESET|ETIMEDOUT|EAI_AGAIN' <<<"$audit_output"; then
              if [[ "$attempt" -lt "$max_attempts" ]]; then
                delay=$((attempt * 15))
                echo "Transient npm audit registry failure on attempt $attempt/$max_attempts; retrying in ${delay}s."
                sleep "$delay"
                continue
              fi

              transient_exhausted=1
              break
            fi

            exit "$audit_status"
          done

          if [[ "$transient_exhausted" -ne 1 ]]; then
            exit 1
          fi

          echo "npm audit advisory service remained unavailable; running pinned production-only OSV fallback."
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.5

          cat > /tmp/osv-production.toml <<'EOF'
          [[PackageOverrides]]
          group = "dev"
          ignore = true
          reason = "Production-only fallback while npm advisory service is unavailable"
          EOF

          "$(go env GOPATH)/bin/osv-scanner" scan source \
            --lockfile=package-lock.json \
            --config=/tmp/osv-production.toml \
            --format=vertical

  production-smoke:
    name: Production smoke (Cloudflare)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - secret-history-scan
      - quality
      - build
      - mobile-route-qa
      - windows-quality
      - dependency-audit
      - shop-postgres-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for exact Cloudflare release and smoke public endpoints
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://mainlagihub.my.id
          EXPECTED_SUPABASE_PROJECT_REF: estvtgflwkebomsqlolv
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 30); do
            home_code="$(curl -sS -L -o /tmp/mainlagi-home.html -w '%{http_code}' \
              --connect-timeout 10 --max-time 20 "$BASE_URL/" || true)"
            shop_code="$(curl -sS -L -o /tmp/mainlagi-shop.html -w '%{http_code}' \
              --connect-timeout 10 --max-time 20 "$BASE_URL/shop" || true)"
            policy_code="$(curl -sS -L -o /tmp/mainlagi-shop-policies.html -w '%{http_code}' \
              --connect-timeout 10 --max-time 20 "$BASE_URL/shop/policies" || true)"
            health_body="$(curl -sS --connect-timeout 10 --max-time 20 \
              "$BASE_URL/api/health" || true)"

            if [[ "$home_code" == "200" ]] \
              && [[ "$shop_code" == "200" ]] \
              && [[ "$policy_code" == "200" ]] \
              && grep -Fq 'Koleksi Mainlagi' /tmp/mainlagi-shop.html \
              && grep -Fq 'Pratinjau' /tmp/mainlagi-shop.html \
              && grep -Fq 'Belanja dengan aturan yang jelas' /tmp/mainlagi-shop-policies.html \
              && grep -Fq '"ok":true' <<<"$health_body" \
              && grep -Fq "\"sha\":\"$EXPECTED_SHA\"" <<<"$health_body" \
              && grep -Fq '"branch":"main"' <<<"$health_body" \
              && grep -Fq '"siteUrl":"https://mainlagihub.my.id"' <<<"$health_body" \
              && grep -Fq '"dataBackend":"supabase"' <<<"$health_body" \
              && grep -Fq "\"supabaseProjectRef\":\"$EXPECTED_SUPABASE_PROJECT_REF\"" <<<"$health_body"; then
              echo "Production is serving expected commit $EXPECTED_SHA with canonical Supabase target."
              echo "$health_body"
              exit 0
            fi

            echo "Attempt $attempt/30: homepage=$home_code shop=$shop_code policies=$policy_code; waiting for exact release/configuration target"
            sleep 10
          done

          echo "Production did not serve the expected commit/configuration within the smoke-test window."
          echo "Last health response: $health_body"
          exit 1
