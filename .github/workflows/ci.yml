name: Mainlagi TV V3 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-history-scan:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.11'
      - name: Install pinned Gitleaks
        shell: bash
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan full Git history
        shell: bash
        run: |
          set -Eeuo pipefail
          "$(go env GOPATH)/bin/gitleaks" git \
            --redact \
            --no-banner \
            --verbose \
            --log-opts="--all" \
            .

  quality:
    name: Quality gate (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate structure and source
        run: npm run validate:structure && npm run audit:source
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm run test:engine
      - name: Simulations
        run: npm run simulate

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build

  windows-quality:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm run test:engine

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy V3 production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - secret-history-scan
      - quality
      - build
      - windows-quality
      - dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: mainlagi-production
      cancel-in-progress: false

    env:
      VPS_HOST: ${{ secrets.MAINLAGI_VPS_HOST }}
      VPS_USER: ${{ secrets.MAINLAGI_VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ secrets.MAINLAGI_VPS_KNOWN_HOSTS }}
      VPS_SSH_KEY: ${{ secrets.MAINLAGI_VPS_SSH_KEY }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in VPS_HOST VPS_USER VPS_KNOWN_HOSTS VPS_SSH_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s' "$VPS_SSH_KEY" > "$HOME/.ssh/mainlagi_deploy"
          chmod 600 "$HOME/.ssh/mainlagi_deploy"
          ssh-keygen -y -f "$HOME/.ssh/mainlagi_deploy" >/dev/null

      - name: Deploy Mainlagi V3
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -T \
            -i "$HOME/.ssh/mainlagi_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" true

      - name: Remove private key from runner
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/mainlagi_deploy"
