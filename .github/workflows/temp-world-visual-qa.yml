name: TEMP Mainlagi World Visual QA

on:
  push:
    branches:
      - feature/mainlagi-world-vertical-slice-20260909

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start app
        run: |
          npm start -- -p 3000 > /tmp/mainlagi-world.log 2>&1 &
          echo $! > /tmp/mainlagi-world.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/child/demo-gian/home > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mainlagi-world.log
          exit 1
      - name: Run world visual and interaction QA
        run: node scripts/temp-world-visual-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainlagi-world-visual-qa
          path: visual-qa-world/
          if-no-files-found: warn
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mainlagi-world.log || true
